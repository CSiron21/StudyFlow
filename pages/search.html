<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudyFlow — Discover</title>
    <link rel="stylesheet" href="../styles/globals.css" />
    <link rel="stylesheet" href="../styles/modal.css" />
  </head>
  <body>
    <button id="hamburger" class="mobile-hamburger" aria-label="Open navigation" aria-controls="mobile-drawer" aria-expanded="false">☰</button>
    <div class="mobile-drawer" id="mobile-drawer" aria-hidden="true">
      <div class="drawer-panel">
        <div class="container">
          <nav aria-label="Mobile Drawer Navigation">
            <ul class="nav-list" role="list">
              <li><a class="nav-link" href="home.html">Home</a></li>
              <li><a class="nav-link" href="study.html">Study</a></li>
              <li><a class="nav-link" href="create.html">Create</a></li>
              <li><a class="nav-link" href="search.html">Discover</a></li>
              <li><a class="nav-link" href="profile.html">Profile</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </div>
    <div class="app">
      <aside class="sidebar" aria-label="Primary Navigation">
        <div class="container">
          <div class="brand">
            <div class="brand-logo"><img src="../assets/sf_logo.png" alt="StudyFlow logo" style="width:100%;height:100%;object-fit:contain;" /></div>
            <div>
              <h1>StudyFlow</h1>
              <p class="muted">Your Smooth Path to Mastery</p>
            </div>
          </div>
          <nav>
            <ul class="nav-list" role="list">
              <li><a class="nav-link" href="home.html">Home</a></li>
              <li><a class="nav-link" href="study.html">Study</a></li>
              <li><a class="nav-link" href="create.html">Create</a></li>
              <li><a class="nav-link" href="search.html">Discover</a></li>
              <li><a class="nav-link" href="profile.html">Profile</a></li>
            </ul>
          </nav>
          
        </div>
      </aside>
      <main>
        <section class="container" aria-label="Search/Discover">
          <div class="panel">
            <div class="grid cols-2" style="align-items:end;">
              <label style="width:100%">Search
                <input id="q" type="search" placeholder="Search study sets" style="width:100%; padding:12px; border:1px solid #e9d5ff; border-radius:12px;" aria-label="Search study sets" />
              </label>
              <label>Subject
                <select id="subj" style="width:100%; padding:12px; border:1px solid #e9d5ff; border-radius:12px;" aria-label="Filter by subject">
                  <option value="">All</option>
                  <option>Mathematics</option>
                  <option>Science</option>
                  <option>History</option>
                  <option>Language</option>
                  <option>Literature</option>
                  <option>Geography</option>
                  <option>Computer Science</option>
                  <option>Art</option>
                  <option>Music</option>
                  <option>Other</option>
                </select>
              </label>
            </div>
          </div>
        </section>
        <section class="container" aria-label="Results">
          <div id="results" class="grid cols-3"></div>
        </section>
        <!-- Edit Modal -->
        <div id="edit-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
          <div class="modal-panel panel">
            <h3 id="edit-modal-title" style="font-weight:800;">Edit Study Set</h3>
            <div class="grid cols-2" style="margin-top:8px;">
              <label>Title<input id="edit-title" type="text" style="width:100%; padding:12px; border:1px solid #e9d5ff; border-radius:12px;" /></label>
              <label>Subject<select id="edit-subject" style="width:100%; padding:12px; border:1px solid #e9d5ff; border-radius:12px;">
                <option>Mathematics</option>
                <option>Science</option>
                <option>History</option>
                <option>Language</option>
                <option>Literature</option>
                <option>Geography</option>
                <option>Computer Science</option>
                <option>Art</option>
                <option>Music</option>
                <option>Other</option>
                <option>General</option>
              </select></label>
            </div>
            <label>Description<textarea id="edit-description" style="width:100%; padding:12px; border:1px solid #e9d5ff; border-radius:12px; min-height:100px;"></textarea></label>
            <div style="margin-top:12px;">
              <h4 style="font-weight:800; margin:0 0 8px;">Cards</h4>
              <div id="edit-cards" class="grid" role="list" aria-label="Edit cards list"></div>
              <div style="margin-top:8px;">
                <button id="edit-add-card" class="btn secondary" aria-label="Add new card">Add New Card</button>
              </div>
            </div>
            <div style="display:flex; gap:8px; margin-top:12px;">
              <button class="btn" id="edit-save" aria-label="Save changes">Save</button>
              <button class="btn secondary" id="edit-cancel" aria-label="Cancel edit">Cancel</button>
            </div>
          </div>
        </div>
        <footer class="container" role="contentinfo" style="padding-bottom: 80px;">
          <p class="muted">© <span id="year"></span> StudyFlow. All rights reserved.</p>
        </footer>
      </main>
    </div>

    <nav class="mobile-nav" aria-label="Mobile Navigation"><div class="nav"><a href="home.html">Home</a><a href="study.html">Study</a><a href="create.html">Create</a><a href="search.html">Discover</a><a href="profile.html">Profile</a></div></nav>

    <script src="../scripts/storage.js"></script>
    <script src="../scripts/main.js"></script>
    <script src="../scripts/discover.js"></script>
    <script>
      const q = document.getElementById('q');
      const subj = document.getElementById('subj');
      const results = document.getElementById('results');

      function render() {
        const sets = window.SFStorage.getSets();
        const text = (q.value || '').toLowerCase();
        const s = subj.value;
        const filtered = sets.filter(it => {
          const matchesText = !text || (it.title || '').toLowerCase().includes(text) || (it.description || '').toLowerCase().includes(text);
          const matchesSubj = !s || it.subject === s;
          return matchesText && matchesSubj;
        });
        if (filtered.length === 0) {
          results.innerHTML = '<div class="panel">No results</div>';
          return;
        }
        results.innerHTML = filtered.map((set) => {
          const safeTitle = escapeHtml(set.title || 'Untitled');
          const safeDesc = escapeHtml(set.description || '');
          return `
            <article class="panel">
              <header style="display:flex; align-items:center; justify-content:space-between;">
                <h4 style="margin:0; font-weight:800;">${safeTitle}</h4>
                <span class="badge">${(set.cards||[]).length} cards</span>
              </header>
              <p class="muted" style="margin:8px 0 12px;">${safeDesc}</p>
              <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" style="width:${Math.min(100, set.progress||0)}%"></div></div>
              <div style="margin-top:12px; display:flex; gap:8px;">
                <a class="btn secondary" href="study.html?set=${encodeURIComponent(set.id)}" aria-label="Study ${safeTitle}">Study</a>
                <button class="btn" data-action="edit" data-id="${set.id}" style="background:#a855f7" aria-label="Edit ${safeTitle}">Edit</button>
                <button class="btn secondary" data-action="delete" data-id="${set.id}" style="color:#ec4899; border-color:#fbcfe8" aria-label="Delete ${safeTitle}">Delete</button>
              </div>
            </article>`;
        }).join('');
        window.SFDiscover && window.SFDiscover.attachHandlers && window.SFDiscover.attachHandlers();
      }
      window.renderDiscover = render;

      function escapeHtml(str) { return String(str).replace(/[&<>"]|'/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m])); }

      q.addEventListener('input', render);
      subj.addEventListener('change', render);
      render();
    </script>
  </body>
  </html>
